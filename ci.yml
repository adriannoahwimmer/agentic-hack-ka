# Codesphere CI-Pipeline (Landscape-Config), siehe
# https://docs.codesphere.com/workspace-toolkit/deployment/configuring-ci-pipeline
schemaVersion: v0.5

prepare:
  steps:
    # venv liegt im Projektordner (/home/user/app), nur der wird zwischen
    # Prepare und Run-Pods persistiert.
    - name: Install dependencies
      command: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt

run:
  api:
    steps:
      - name: Start FastAPI
        command: .venv/bin/uvicorn main:app --host 0.0.0.0 --port 3000
    # Plan-ID (CPU/RAM-Tier) ggf. im Landscape Config Editor anpassen.
    plan: 20
    replicas: 1
    # Codesphere prüft standardmäßig Port 3000; GET / ist unser Healthcheck.
    healthEndpoint: http://localhost:3000/
    network:
      ports: [3000]
    # GEMINI_API_KEY NICHT hier eintragen, sondern im Codesphere-UI unter
    # "Environment Variables" setzen. Alternative mit Vault-Secret:
    # env:
    #   GEMINI_API_KEY: ${{ vault.GEMINI_API_KEY }}
